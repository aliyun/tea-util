name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
defaults:
  run:
    shell: bash
    working-directory: swift

jobs:
  build-ubuntu-latest:
    name: Swift ${{ matrix.swift }} on ubuntu-latest
    strategy:
      matrix:
        # ubuntu swift5.7及以下版本下载会报gpg签名错误，已知bug等官方解决
        swift: ["5.8", "5.9", "5.10", "6.1"]
      fail-fast: false
    runs-on: ubuntu-22.04
    steps:
    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: ${{ matrix.swift }}
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  # macos-latest is macOS 26 / Xcode 26, whose SDK is built with Swift 6.3.
  # A downloaded Swift 5.9–6.1 toolchain cannot import that SDK. Use the
  # Xcode that matches each image instead of swift-actions/setup-swift.
  build-macos-15:
    name: Xcode ${{ matrix.xcode }} on macos-15
    strategy:
      matrix:
        xcode: ["16.0", "16.4"]
      fail-fast: false
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
    - name: Verify Xcode Version
      run: xcodebuild -version && swift --version
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  build-macos-latest:
    name: Xcode on macos-latest
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify Xcode Version
      run: xcodebuild -version && swift --version
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
