name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: swift

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode_select: /Applications/Xcode_16.4.app/Contents/Developer
            name: Xcode 16.4 on macos-15
          - os: macos-26
            xcode_select: ""
            name: default Xcode on macos-26
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Check out Tea for PR validation
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 377
      uses: actions/checkout@v4
      with:
        repository: aliyun/tea-swift
        ref: 3bccab85322a20928cbe734f7429ba4640e8d68c
        path: .swift-ci/tea-swift
        persist-credentials: false
    - name: Select Xcode
      if: matrix.xcode_select != ''
      run: sudo xcode-select -s "${{ matrix.xcode_select }}"
    - name: Verify toolchain
      run: |
        xcodebuild -version
        swift --version
    - name: Prepare unpublished Swift dependencies
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 377
      run: python3 "$GITHUB_WORKSPACE/.swift-ci/tea-swift/.github/scripts/prepare-swift-dependencies.py" "$GITHUB_WORKSPACE/swift"
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  linux:
    name: Swift ${{ matrix.swift }} on Linux
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["5.10-jammy", "6.1-jammy"]
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Check out Tea for PR validation
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 377
      uses: actions/checkout@v4
      with:
        repository: aliyun/tea-swift
        ref: 3bccab85322a20928cbe734f7429ba4640e8d68c
        path: .swift-ci/tea-swift
        persist-credentials: false
    - name: Prepare unpublished Swift dependencies
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 377
      run: python3 "$GITHUB_WORKSPACE/.swift-ci/tea-swift/.github/scripts/prepare-swift-dependencies.py" "$GITHUB_WORKSPACE/swift"
    - name: Run tests
      run: swift test
