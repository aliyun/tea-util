name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: swift

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode_select: /Applications/Xcode_16.4.app/Contents/Developer
            name: Xcode 16.4 on macos-15
          - os: macos-26
            xcode_select: ""
            name: default Xcode on macos-26
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Check out Tea for PR validation
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 377
      uses: actions/checkout@v4
      with:
        repository: aliyun/tea-swift
        ref: 51b0c3a5e7151cc6a1cd2b789d89b7e077cf2608
        path: .swift-ci/tea-swift
        persist-credentials: false
    - name: Select Xcode
      if: matrix.xcode_select != ''
      run: sudo xcode-select -s "${{ matrix.xcode_select }}"
    - name: Verify toolchain
      run: |
        xcodebuild -version
        swift --version
    - name: Prepare unpublished Swift dependencies
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 377
      run: python3 "$GITHUB_WORKSPACE/.swift-ci/tea-swift/.github/scripts/prepare-swift-dependencies.py" "$GITHUB_WORKSPACE/swift"
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  linux:
    name: Swift ${{ matrix.swift }} on Linux
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["5.7.3-jammy", "5.8.1-jammy", "5.9.2-jammy", "5.10.1-jammy", "6.0.3-jammy", "6.1.3-jammy", "6.2.4-jammy", "6.3.3-jammy", "6.4.0-jammy"]
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Check out Tea for PR validation
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 377
      uses: actions/checkout@v4
      with:
        repository: aliyun/tea-swift
        ref: 51b0c3a5e7151cc6a1cd2b789d89b7e077cf2608
        path: .swift-ci/tea-swift
        persist-credentials: false
    - name: Install Python for Swift 5.7 dependency preparation
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 377 && startsWith(matrix.swift, '5.7.')
      run: apt-get update && apt-get install -y --no-install-recommends python3
    - name: Prepare unpublished Swift dependencies
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 377
      run: python3 "$GITHUB_WORKSPACE/.swift-ci/tea-swift/.github/scripts/prepare-swift-dependencies.py" "$GITHUB_WORKSPACE/swift"
    - name: Run tests
      if: ${{ !startsWith(matrix.swift, '5.7.') }}
      run: swift test
    - name: Verify Swift 5.7 is unsupported on Linux
      if: startsWith(matrix.swift, '5.7.')
      run: |
        if swift test > swift-test.log 2>&1; then
          cat swift-test.log
          exit 1
        fi
        cat swift-test.log
        grep -F "error: Tea on Linux requires Swift 5.8 or later." swift-test.log
