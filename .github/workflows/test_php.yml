# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: PHP CI with Composer

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
defaults:
  run:
    shell: bash
    working-directory: php
jobs:
  build:

    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ubuntu-latest]
        php-versions: ['5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1']
      fail-fast: false
    name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.operating-system }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: mbstring, intl
        ini-values: post_max_size=256M, max_execution_time=180
        coverage: xdebug        
        tools: php-cs-fixer, phpunit

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Require phpunit
      run: composer require phpunit/phpunit --dev

    - name: Run test case
      run: |
        composer run-script clearCache
        mkdir -p cache
        phpunit_major="$(./vendor/bin/phpunit --version | sed -n 's/.*PHPUnit \([0-9][0-9]*\).*/\1/p' | head -1)"
        if [ "$phpunit_major" -ge 9 ]; then
          ./vendor/bin/phpunit --colors=always --coverage-clover cache/coverage.clover
        else
          ./vendor/bin/phpunit --colors=always --whitelist src --coverage-clover cache/coverage.clover
        fi

    - name: Upload code coverage report
      uses: codecov/codecov-action@v4
      with:
        flags: php
        name: php-${{ matrix.php-versions }}
        files: ./php/cache/coverage.clover
        token: ${{ secrets.CODECOV_TOKEN }}
